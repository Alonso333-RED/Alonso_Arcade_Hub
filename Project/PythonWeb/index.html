<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Python Console</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: monospace;
        }

        #terminal {
            width: min(1000px, 95%);
            margin: 30px auto;
        }

        #output {
            height: 600px;
            overflow-y: auto;

            padding: 20px;

            background: #000;
            border: 1px solid #444;

            white-space: pre-wrap;

            cursor: text;
        }

        #input-line {
            display: flex;

            margin-top: 10px;

            background: #000;
            border: 1px solid #444;
        }

        #prompt {
            padding: 10px;
        }

        #command {
            flex: 1;

            padding: 10px;

            border: none;
            outline: none;

            background: transparent;
            color: #eee;

            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div id="terminal">

    <div id="output"></div>

    <div id="input-line">

        <span id="prompt">>>></span>

        <input
            id="command"
            type="text"
            autocomplete="off"
            autofocus
        >

    </div>

</div>

<script src="./pyodide/pyodide.js"></script>
<script src="./console.js"></script>

</body>

</html>
